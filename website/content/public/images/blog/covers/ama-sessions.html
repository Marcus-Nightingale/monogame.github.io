<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MonoGame Blog Cover</title>
    <style>
        :root {
            --cover-width: 1000px;
            --cover-height: 450px;
            --cover-bg: #0b1118;
            --cover-accent: #8b45ff;
            --cover-accent-soft: #c05cff;
            --cover-pink: #d84bdc;
            --cover-text: #ffffff;
            --cover-muted: rgba(255, 255, 255, 0.74);
            --cover-grid: rgba(255, 255, 255, 0.035);
            --cover-grid-soft: rgba(255, 255, 255, 0.02);
            --cover-border: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-width: 100%;
            min-height: 100%;
            margin: 0;
            background: #ffffff;
            color: var(--cover-text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px;
        }


        .cover {
            position: relative;
            width: var(--cover-width);
            height: var(--cover-height);
            border: 1px solid rgba(139, 69, 255, 0.28);
            border-bottom-color: var(--cover-accent);
            overflow: hidden;
            background: radial-gradient(circle at 82% 8%, rgba(139, 69, 255, 0.24), transparent 210px),
            radial-gradient(circle at 66% 56%, rgba(216, 75, 220, 0.14), transparent 190px),
            radial-gradient(circle at 18% 84%, rgba(139, 69, 255, 0.12), transparent 220px),
            linear-gradient(135deg, #080c14 0%, #101331 48%, #151033 100%);
            color: var(--cover-text);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
        }

        .cover::before {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(var(--cover-grid-soft) 1px, transparent 1px),
            linear-gradient(90deg, var(--cover-grid-soft) 1px, transparent 1px),
            linear-gradient(var(--cover-grid) 1px, transparent 1px),
            linear-gradient(90deg, var(--cover-grid) 1px, transparent 1px);
            background-size: 24px 24px, 24px 24px, 0 0, 0 0;
            mask-image: radial-gradient(circle at 100% 0%, transparent 0 18%, rgba(0, 0, 0, 0.35) 34%, black 58%),
            linear-gradient(90deg, black 0%, black 68%, rgba(0, 0, 0, 0.32) 86%, transparent 100%);
            mask-composite: intersect;
            content: "";
            pointer-events: none;
        }

        .cover::after {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(5, 8, 16, 0.58), transparent 330px),
            linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.22) 100%);
            content: "";
            pointer-events: none;
        }

        .logo {
            position: absolute;
            top: 48px;
            left: 58px;
            z-index: 3;
            display: block;
            width: 220px;
            height: auto;
        }

        .content {
            position: absolute;
            z-index: 3;
            left: 58px;
            top: 186px;
            width: 560px;
        }

        h1 {
            max-width: 540px;
            margin: 0;
            color: var(--cover-text);
            font-size: 51px;
            font-weight: 950;
            letter-spacing: -0.055em;
            line-height: 0.98;
            text-transform: uppercase;
            text-shadow: 0 5px 18px rgba(0, 0, 0, 0.38);
        }

        .subtitle {
            max-width: 520px;
            margin: 20px 0 0;
            color: var(--cover-accent-soft);
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.03em;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .dot-field {
            position: absolute;
            top: -30px;
            right: -30px;
            z-index: 1;
            width: 190px;
            height: 190px;
            opacity: 0.35;
            overflow: hidden;
            border-top-right-radius: 7px;
            background-image: radial-gradient(circle, var(--cover-accent) 0 1.6px, transparent 1.8px);
            background-size: 13px 13px;
            background-position: top right;
            mask-image: radial-gradient(circle at 100% 0%, black 0 48%, rgba(0, 0, 0, 0.58) 62%, transparent 78%);
        }

        .ama-art {
            position: absolute;
            inset: 0;
            z-index: 2;
            color: var(--cover-accent);
            pointer-events: none;
        }

        .ama-bubbles {
            position: absolute;
            top: 74px;
            right: 60px;
            width: 560px;
            height: 285px;
            overflow: visible;
            opacity: 1;
            filter: drop-shadow(0 0 22px rgba(139, 69, 255, 0.24));
        }

        .ama-bubble-fill {
            fill: #17113a;
            opacity: 1;
        }

        .ama-bubble-stroke {
            fill: none;
            stroke: currentColor;
            stroke-width: 5;
            stroke-linejoin: round;
            opacity: 0.76;
        }

        .ama-bubble-line {
            stroke: currentColor;
            stroke-width: 6;
            stroke-linecap: round;
            opacity: 0.66;
        }

        .ama-bubble-line-soft {
            opacity: 0.46;
        }

        .ama-heart {
            position: absolute;
            right: 180px;
            top: 290px;
            width: 96px;
            height: 88px;
            color: var(--cover-pink);
            opacity: 0.9;
            filter: drop-shadow(0 0 12px rgba(216, 75, 220, 0.34)) drop-shadow(5px 5px 0 rgba(41, 18, 78, 0.55));
        }

        .ama-heart svg {
            display: block;
            width: 100%;
            height: 100%;
            shape-rendering: crispEdges;
        }

        .ama-heart-main {
            fill: var(--cover-pink);
        }

        .ama-heart-light {
            fill: #f18cf2;
            opacity: 0.72;
        }

        .ama-heart-mid {
            fill: #b934cf;
            opacity: 0.6;
        }

        .ama-heart-shadow {
            fill: #5d2289;
            opacity: 0.6;
        }

        .linework {
            position: absolute;
            inset: 0;
            z-index: 1;
            color: var(--cover-accent);
            opacity: .34;
            pointer-events: none;
            top: 10px;
            right: -27px;
        }

        .linework svg {
            width: 100%;
            height: 100%;
        }

        .corner-block {
            position: absolute;
            right: 0;
            bottom: -20px;
            z-index: 1;
            width: 350px;
            height: 49px;
            background: var(--cover-accent);
            clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
            opacity: 0.42;
        }

        @media print {
            html,
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            body {
                display: block;
                padding: 0;
            }

        }
    </style>
</head>
